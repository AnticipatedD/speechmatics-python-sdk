name: Test and Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test-rt:
    name: Test RT SDK
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify Lockfile Parity
        run: pip install poetry && poetry check --lock
      - name: Install dependencies
        run: make install-dev-rt
      - name: Dependency Security Audit
        run: pip install pip-audit && pip-audit
      - name: Lint RT SDK
        run: make lint-rt
      - name: Test RT SDK
        run: make test-rt && pytest sdk/rt/tests/ --cov=sdk/rt --cov-fail-under=50
      - name: Build RT SDK
        run: make build-rt

  test-batch:
