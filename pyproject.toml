[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-sovereign-voip-agent"
version = "0.1.0"
description = "Enterprise-grade Sovereign Voice AI & Real-Time Telephony Agent using Speechmatics SDK"
readme = "README.md"
authors = [
    { name = "MD Abul Hossain (BigBoss)", email = "mdabul1008@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "speechmatics-rt>=1.0.0",
    "speechmatics-voice>=1.0.0",
    "speechmatics-batch>=1.0.0",
    "python-dotenv>=1.0.0",
    "pyaudio>=0.2.14"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sovereign_agent*"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src", "sdk/agent_stt", "sdk/batch", "sdk/flow", "sdk/rt", "sdk/tts", "sdk/voice"]

[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "B008",   # do not perform function calls in argument defaults
    "E203",   # whitespace before ':'
    "N818",   # Exception name should end with Error - we have ForceEndSession by design
    "UP007",  # Use X | Y for type annotations
    "B904",   # Within except clause, raise exceptions with raise ... from err
    "SIM105", # Use contextlib.suppress
    "SIM108", # Use ternary operator
    "SIM117", # Use single with statement
    "E501",   # Line too long - handled by black
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.isort]
known-first-party = ["sovereign_agent", "speechmatics"]
force-single-line = true

[tool.mypy]
python_version = "3.10"
explicit_package_bases = true
namespace_packages = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
exclude = ["tests/", "build/", "dist/"]

[[tool.mypy.overrides]]
module = "websockets.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["src/sovereign_agent"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
precision = 2
