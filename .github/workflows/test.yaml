name: CI Test Matrix & Security Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-audit:
    name: Validate Python SDK & Audit Dependencies
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Astral uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Validate Lockfile Parity
        run: uv lock --check

      - name: Install Monorepo SDK Development Dependencies
        run: |
          uv sync --all-extras --dev

      - name: Run Dependency Security Audit
        run: |
          uv pip install pip-audit
          uv run pip-audit

      - name: Execute Sub-Package Test Suite
        run: |
          uv run pytest
